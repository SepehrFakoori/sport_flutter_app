name: sport_flutter_app
description: "A Flutter application for sport management."

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  get_it: ^9.2.0
  flutter_bloc: ^9.1.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  shimmer: ^3.0.0
  responsive_framework: ^1.5.1
  infinite_scroll_pagination: ^5.1.1
  stac: ^1.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  pretty_dio_logger: ^1.4.0
  test: ^1.30.0
  mockito: ^5.6.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/

