name: sport_flutter_app
description: "A Flutter application for sport management."

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  get_it: ^9.2.0
  flutter_bloc: ^9.1.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.1
  equatable: ^2.0.8
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  shimmer: ^3.0.0
  responsive_framework: ^1.5.1
  infinite_scroll_pagination: ^5.1.1
  stac: ^1.4.0
  #  package_info_plus: ^10.1.0
  #  device_info_plus: ^13.1.0
  pretty_dio_logger: ^1.4.0
  dio: ^5.9.2
  web_socket_channel: ^3.0.3
  smooth_page_indicator: ^2.0.1
  lottie: ^3.4.0
  pinput: ^6.0.2
  firebase_messaging: ^16.4.1
  firebase_core: ^4.11.0
  persian_datetime_picker: ^3.2.0
  #  flutter_local_notifications: ^22.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.30.0
  mockito: ^5.6.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: IranYekanX
      fonts:
        - asset: assets/fonts/IRANYekanXFaNum-Regular.ttf
          weight: 400
        - asset: assets/fonts/IRANYekanXFaNum-Medium.ttf
          weight: 500
        - asset: assets/fonts/IRANYekanXFaNum-DemiBold.ttf
          weight: 600
        - asset: assets/fonts/IRANYekanXFaNum-Bold.ttf
          weight: 700
